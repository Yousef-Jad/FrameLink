name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libpulse0 libpipewire-0.3-0 libxcb-randr0 libxcb-image0 libxcb-render-util0 ffmpeg xvfb
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check source
        run: python -m ruff check src tests tools
      - name: Test media, security, and storage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Validate mobile JavaScript
        run: node --check src/lumacapture/web/camera.js
      - name: Runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m lumacapture.app --smoke-test --data-dir artifacts/smoke-data --screenshot artifacts/dashboard.png
      - name: Real X11 capture in virtual display
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ''
        run: xvfb-run -a -s '-screen 0 1280x720x24' python -m lumacapture.app --capture-test artifacts/x11-capture --data-dir artifacts/x11-data
      - name: Package and execute frozen application
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaCapture-${{ runner.os }}-verification
          path: |
            artifacts/*.xml
            artifacts/*.png
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: warn
