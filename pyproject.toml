[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumacapture"
version = "0.1.0"
description = "Local desktop and phone camera recording studio"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0",
  "aiortc==1.15.0", "av==17.1.0", "aiohttp==3.14.5",
  "cryptography==50.0.2", "qrcode==8.2", "pillow==12.3.0",
  "psutil==7.2.2", "numpy>=2.2,<3",
  "windows-capture==2.0.1; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14", "pyinstaller>=6.16,<7"]
[project.scripts]
lumacapture = "lumacapture.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
lumacapture = ["web/*", "assets/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: real media or transport integration", "display: requires a desktop capture session"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
